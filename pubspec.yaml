name: arb_translator
description: A command-line utility which helps to translate arb files with the use of google translations.
version: 3.0.1
homepage: https://github.com/justkawal/arb_translator.git

environment:
  sdk: ">=3.0.1 <4.0.0"

dependencies:
  arb_merge: ^1.2.0
  args: ^2.7.0
  collection: ^1.19.1
  console: ^4.1.0
  html_unescape: ^2.0.0
  http: ^1.4.0
  path: ^1.9.1
  petitparser: ^6.1.0
  yaml: ^3.1.3
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
